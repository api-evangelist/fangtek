name: FangTek
description: >-
  FangTek (Shanghai Fangtek Electronics Co., Ltd.) is a Chinese fabless
  semiconductor company headquartered in Shanghai. It designs highly integrated
  analog and mixed-signal integrated circuits for mobile phones, portable devices
  and consumer electronics, with a product line spanning audio power amplifiers,
  voice and audio processing, image processing, LED drivers, power management
  ICs, analog switches and DC boost converters. Qiming Venture Partners lists
  FangTek in its portfolio as "a leading provider of highly integrated circuit
  solutions for cell phone, portable device, voice processing, audio processing
  and image processing." FangTek is a silicon component vendor that reaches
  customers through electronics distributors; it publishes no public developer
  platform, web API, SDK or machine-readable API surface, so this profile carries
  identity and domain-security data only.
